# ═══════════════════════════════════════════════════════════════
#  SoulServe | Render Blueprint
#  Services:
#    1. soulserves     — PHP 8.2 + Apache (Web App)
#    2. soulserves-ai  — Python Flask AI API
#
#  Deploy: Render Dashboard → New → Blueprint → connect GitHub repo
# ═══════════════════════════════════════════════════════════════
services:

  # ── Service 1: PHP Web Application ───────────────────────────
  - type: web
    name: soulserves
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Render routes external traffic → this internal port
    # docker-entrypoint.sh sets Apache to listen on $PORT
    healthCheckPath: /health.php
    envVars:
      - key: APP_URL
        value: https://soulserves.onrender.com

      # ── Railway MySQL ──────────────────────────────────────
      # Set these in Render Dashboard → soulserves → Environment
      - key: DB_HOST
        value: sakura.proxy.rlwy.net
      - key: DB_PORT
        value: "20090"
      - key: DB_USER
        value: root
      - key: DB_PASS
        sync: false          # Set in Render Dashboard (never commit)
      - key: DB_NAME
        value: adhaar_db     # Fixed: was 'railway', correct is 'adhaar_db'

      # ── Mail ──────────────────────────────────────────────
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: rtkarle03@gmail.com
      - key: MAIL_PASSWORD
        sync: false          # Set in Render Dashboard

      # ── Cloudinary ────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        value: soulserves
      - key: CLOUDINARY_API_KEY
        value: "221996235797965"
      - key: CLOUDINARY_API_SECRET
        sync: false          # Set in Render Dashboard

      # ── Flask AI (soulserves-ai service) ──────────────────
      - key: AI_FLASK_URL
        value: https://soulserves-ai.onrender.com   # Fixed: correct service name

  # ── Service 2: Python Flask AI API ───────────────────────────
  - type: web
    name: soulserves-ai
    runtime: docker
    dockerfilePath: ./ai_python/Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "5000"
      - key: GEMINI_API_KEY
        sync: false          # Optional — set in Render Dashboard
